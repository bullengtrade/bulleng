name: Crypto data

on:
  schedule:
    - cron: "15 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Fetch crypto data
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: python scripts/crypto.py
      - name: Save to the repository
        run: |
          git config user.name "bulleng-bot"
          git config user.email "bulleng-bot@users.noreply.github.com"
          git add data/crypto
          git diff --cached --quiet && exit 0
          git commit -m "Crypto data $(date -u +%F-%H%M)"
          git pull --rebase
          git push
