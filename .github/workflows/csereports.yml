name: CSE financial reports

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Read CSE financial reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/csereports.py
      - name: Save to the repository
        run: |
          git config user.name "bulleng-bot"
          git config user.email "bulleng-bot@users.noreply.github.com"
          git add data/lk/reports
          git diff --cached --quiet && exit 0
          git commit -m "CSE reports $(date -u +%F)"
          git pull --rebase
          git push
