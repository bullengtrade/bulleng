name: News collector

on:
  schedule:
    - cron: "0 1,7,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Collect news headlines
        run: python scripts/fetch_news.py
      - name: Tag news with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/tagnews.py
      - name: Link companies to sectors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/classify.py
      - name: Save to the repository
        run: |
          git config user.name "bulleng-bot"
          git config user.email "bulleng-bot@users.noreply.github.com"
          git add data/news data/lk/sectormap.json
          git diff --cached --quiet && exit 0
          git commit -m "News $(date -u +%F-%H%M)"
          git pull --rebase
          git push
