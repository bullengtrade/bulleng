name: CSE daily data

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Fetch CSE data
        run: python scripts/fetch_cse.py
      - name: Build site data
        run: python scripts/build_lk.py
      - name: Dividends and financial filings
        run: python scripts/cseevents.py
      - name: Save data to the repository
        run: |
          git config user.name "bulleng-bot"
          git config user.email "bulleng-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "CSE data $(date -u +%F)"
          git pull --rebase
          git push
