name: US and UK markets

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install yfinance pandas
      - name: Fetch US and UK market data
        run: python scripts/markets.py
      - name: Fetch US company financials (SEC)
        run: python scripts/fundamentals.py
      - name: Fetch UK company financials
        run: python scripts/ukfund.py
      - name: Fear and Greed indices
        run: python scripts/fg.py
      - name: Save to the repository
        run: |
          git config user.name "bulleng-bot"
          git config user.email "bulleng-bot@users.noreply.github.com"
          git add data/us data/uk data/fg.json data/lk/fg_history.json
          git diff --cached --quiet && exit 0
          git commit -m "US and UK data $(date -u +%F)"
          git pull --rebase
          git push
