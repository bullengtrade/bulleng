<style>
:root{
  --paper:#EEF1EE; --panel:#FFFFFF; --ink:#16232A; --ink2:#46555C; --ink3:#7C8A90;
  --line:#D6DDD9; --saffron:#E0A100; --maroon:#7A1F2B;
  --up:#1F8A5B; --up-bg:#DCEFE5; --down:#B3261E; --down-bg:#F6DEDC; --flat:#8A969B;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10191D; --panel:#17232A; --ink:#E8EEEB; --ink2:#B5C1BD; --ink3:#7F8E92;
    --line:#2A3940; --up:#3FBF86; --up-bg:#16372A; --down:#EF6A5F; --down-bg:#3D1C1B; --flat:#7F8E92;
  }
}
:root[data-theme="dark"]{
  --paper:#10191D; --panel:#17232A; --ink:#E8EEEB; --ink2:#B5C1BD; --ink3:#7F8E92;
  --line:#2A3940; --up:#3FBF86; --up-bg:#16372A; --down:#EF6A5F; --down-bg:#3D1C1B; --flat:#7F8E92;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);}
.bar{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px;height:60px;}
.brand{font-weight:900;font-stretch:118%;font-size:24px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px;}
.brand svg{flex:none;}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;}
nav a{text-decoration:none;font-size:14px;font-weight:600;color:var(--ink2);padding:8px 12px;border-radius:6px;white-space:nowrap;}
nav a.on{background:var(--ink);color:var(--paper);}
nav a small{font-weight:500;font-size:11px;color:var(--ink3);margin-left:4px;}
.theme{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:6px;padding:6px 10px;font-size:13px;}

.sample{background:var(--saffron);color:#16232A;font-size:13px;font-weight:600;text-align:center;padding:6px 16px;}

main{max-width:1180px;margin:0 auto;padding:32px 20px 56px;}

/* Hero: the day in one sentence */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end;padding-bottom:32px;border-bottom:3px solid var(--ink);}
.date{font-size:14px;color:var(--ink3);margin-bottom:10px;}
.story{font-size:clamp(26px,3.6vw,40px);line-height:1.15;font-weight:700;font-stretch:88%;letter-spacing:-.015em;max-width:24ch;}
.story .up{color:var(--up);} .story .down{color:var(--down);}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;}
.idx div span{display:block;font-size:13px;color:var(--ink3);}
.idx div b{display:block;font-size:26px;font-weight:800;font-stretch:90%;}
.idx div i{font-style:normal;font-size:14px;font-weight:600;}

/* Sections */
section{margin-top:40px;}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
h2{font-size:22px;font-weight:800;font-stretch:90%;letter-spacing:-.01em;}
.note{font-size:13px;color:var(--ink3);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{background:var(--panel);border:none;color:var(--ink2);font-size:13px;font-weight:600;padding:6px 14px;}
.seg button+button{border-left:1px solid var(--line);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

/* Sector heat map (the signature element) */
.heat{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:92px;gap:4px;}
.tile{border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#fff;transition:background .3s;}
.tile.w2{grid-column:span 2;} .tile.h2{grid-row:span 2;}
.tile .tn{font-size:13px;font-weight:600;line-height:1.25;}
.tile .tp{font-size:22px;font-weight:800;font-stretch:90%;}
.tile.h2 .tp{font-size:34px;}
.tile .tv{font-size:12px;opacity:.85;}

/* Two-column block */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink3);padding:0 0 8px;border-bottom:1px solid var(--line);}
th.r,td.r{text-align:right;}
td{padding:9px 0;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
td .co{display:block;font-size:12px;color:var(--ink3);}
.pill{display:inline-block;min-width:64px;text-align:right;padding:2px 8px;border-radius:4px;font-weight:700;}
.pill.up{background:var(--up-bg);color:var(--up);} .pill.down{background:var(--down-bg);color:var(--down);}

/* Chart + breadth */
.chart{width:100%;height:200px;display:block;}
.breadth{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:14px 0 8px;}
.breadth div{height:100%;}
.blegend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.stats span{display:block;font-size:12px;color:var(--ink3);}
.stats b{font-size:18px;font-weight:700;}

/* Economic news */
.tile{cursor:pointer;border:none;text-align:left;font:inherit;}
.tile[aria-pressed="true"]{outline:3px solid var(--saffron);outline-offset:-3px;}
.filter{font-size:13px;color:var(--ink2);margin-bottom:12px;min-height:20px;}
.filter button{background:none;border:none;color:var(--ink);text-decoration:underline;font-size:13px;margin-left:6px;}
.news{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--flat);border-radius:8px;padding:14px 16px;}
.item.pos{border-left-color:var(--up);} .item.neg{border-left-color:var(--down);}
.item .meta{font-size:12px;color:var(--ink3);margin-bottom:4px;}
.item h3{font-size:16px;font-weight:700;line-height:1.3;margin-bottom:6px;}
.item h3 a{text-decoration:none;} .item h3 a:hover{text-decoration:underline;}
.item p{font-size:14px;color:var(--ink2);margin-bottom:10px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--paper);color:var(--ink2);border:1px solid var(--line);}
.tag.pos{background:var(--up-bg);color:var(--up);border-color:transparent;}
.tag.neg{background:var(--down-bg);color:var(--down);border-color:transparent;}
.empty{grid-column:1/-1;padding:24px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:8px;font-size:14px;}
@media (max-width:900px){.news{grid-template-columns:1fr;}}

a.tag{text-decoration:none;}
a.tag:hover{text-decoration:underline;}
.tlink{text-decoration:none;} .tlink:hover{text-decoration:underline;}
.back{display:inline-block;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;margin-bottom:18px;}
.back:hover{color:var(--ink);}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:24px;border-bottom:3px solid var(--ink);}
.dkind{font-size:14px;color:var(--ink3);margin-bottom:6px;}
.dkind a{color:var(--ink2);}
.dname{font-size:clamp(30px,4.5vw,48px);font-weight:800;font-stretch:88%;letter-spacing:-.02em;line-height:1.05;}
.dprice{text-align:right;}
.dprice b{display:block;font-size:34px;font-weight:800;font-stretch:90%;}
.dprice i{font-style:normal;font-weight:700;font-size:16px;}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.kv span{display:block;font-size:12px;color:var(--ink3);}
.kv b{font-size:18px;font-weight:700;}
.plist{display:flex;flex-wrap:wrap;gap:8px;}
.iv{margin-top:10px;font-size:14px;color:var(--ink2);}
.iv b{font-size:18px;color:var(--ink);}
.iv .gap{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:4px;font-weight:700;font-size:13px;}
.gap.under{background:var(--up-bg);color:var(--up);} .gap.over{background:var(--down-bg);color:var(--down);} .gap.fair{background:var(--paper);color:var(--ink2);border:1px solid var(--line);}
.ivbar{position:relative;height:10px;background:var(--paper);border:1px solid var(--line);border-radius:5px;margin:28px 0 30px;}
.ivbar .rng{position:absolute;top:0;height:100%;background:color-mix(in srgb,var(--saffron) 45%,transparent);border-radius:5px;}
.ivbar .mk{position:absolute;top:-6px;width:3px;height:20px;border-radius:2px;transform:translateX(-50%);}
.ivbar .mk span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;}
.ivbar .mk.px{background:var(--ink);} .ivbar .mk.px span{top:-20px;color:var(--ink);}
.ivbar .mk.ev{background:var(--saffron);} .ivbar .mk.ev span{top:22px;color:var(--ink2);}
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:14px;}
.ctrl input{flex:1;min-width:160px;accent-color:var(--saffron);}
details{margin-top:14px;font-size:14px;color:var(--ink2);}
details summary{cursor:pointer;font-weight:600;color:var(--ink);}
details p{margin-top:8px;max-width:75ch;}
@media (max-width:560px){.kv{grid-template-columns:1fr 1fr;}.dprice{text-align:left;}}

.soon{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.soon div{border:1px dashed var(--line);border-radius:10px;padding:16px;}
.soon b{display:block;font-size:15px;margin-bottom:4px;}
.soon p{font-size:13px;color:var(--ink3);}

footer{border-top:1px solid var(--line);margin-top:48px;padding:20px 0 0;font-size:12px;color:var(--ink3);max-width:80ch;}

@media (max-width:900px){
  .hero,.cols{grid-template-columns:1fr;gap:28px;}
  .heat{grid-template-columns:repeat(3,1fr);}
  .soon{grid-template-columns:1fr 1fr;}
}
@media (max-width:560px){
  .bar{gap:12px;}
  .heat{grid-template-columns:repeat(2,1fr);grid-auto-rows:84px;}
  .tile.w2{grid-column:span 2;}
  .soon{grid-template-columns:1fr;}
  .stats{grid-template-columns:1fr 1fr;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px;margin-bottom:12px;}
.range{position:relative;height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;margin:26px 0 8px;}
.range i{position:absolute;top:-6px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%);}
.rlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);}
.msg{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--ink3);font-size:14px;text-align:center;}
.tile.nodata{background:var(--flat)!important;}
@media (max-width:560px){nav a small{display:none}.bar{gap:6px;padding:0 12px}.brand{font-size:19px;gap:5px}.brand svg{width:22px}nav a{padding:6px 7px;font-size:13px}.theme{padding:5px 7px}}
.risk{border:1px solid var(--saffron);background:color-mix(in srgb,var(--saffron) 12%,transparent);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--ink);margin:18px 0 0;}
.fg{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.fg b.v{font-size:48px;font-weight:800;font-stretch:88%;line-height:1;}
.fgbar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#B3261E,#E0A100 50%,#1F8A5B);flex:1;min-width:180px;}
.fgbar i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-50%);}
.fghist{display:flex;gap:2px;align-items:flex-end;height:40px;margin-top:14px;}
.fghist span{flex:1;border-radius:2px 2px 0 0;}
.sf{display:none}
@media (max-width:430px){.lf{display:none}.sf{display:inline}nav a{padding:6px 6px}}
@media (max-width:350px){.brand .bn{display:none}}
.sitefoot{max-width:1180px;margin:0 auto;padding:18px 20px 40px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink3);border-top:1px solid var(--line);}
.sitefoot a{color:var(--ink2);}
.prose{max-width:72ch;}
.prose h1{font-size:clamp(28px,4vw,40px);font-weight:800;font-stretch:88%;letter-spacing:-.02em;margin-bottom:12px;}
.prose h2{margin:28px 0 8px;}
.prose p,.prose li{font-size:16px;color:var(--ink2);margin-bottom:10px;}
.prose ul{padding-left:20px;margin-bottom:10px;}
.fresh{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:1px;background:var(--up-bg);color:var(--up);}
.fresh.late{background:var(--down-bg);color:var(--down);}
.delay{border:1px solid var(--down);background:var(--down-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px;}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600;color:var(--ink2);margin-top:8px;}
.star[aria-pressed="true"]{border-color:var(--saffron);color:var(--ink);background:color-mix(in srgb,var(--saffron) 18%,transparent);}
</style>
</head>

<header>
  <div class="bar">
    <a href="#/" class="brand" aria-label="BullEng home">
      <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true"><path d="M2 2c1 5 4 7 8 7h8c4 0 7-2 8-7" fill="none" stroke="var(--saffron)" stroke-width="3" stroke-linecap="round"/><path d="M8 9v6c0 3 3 5 6 5s6-2 6-5V9" fill="var(--ink)"/></svg>
      <span class="bn">BullEng</span>
    </a>
    <nav aria-label="Markets">
      <a href="#/" data-m="lk" class="on"><span class="lf">Colombo</span><span class="sf">CSE</span></a>

      <a href="#/crypto" data-m="crypto">Crypto</a>
    </nav>
    <a class="theme" href="#/search" aria-label="Search all markets" style="text-decoration:none">🔍</a>
    <button class="theme" id="themeBtn" type="button">Dark</button>
  </div>
</header>

<main id="app"><p class="msg">Loading today's CSE data…</p></main>
<nav class="sitefoot" aria-label="About BullEng"><a href="#/about">About &amp; disclaimer</a><a href="#/methodology">How BullEng works</a><a href="#/privacy">Privacy</a><span>© BullEng</span></nav>

<script>
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=2)=>n==null?'—':(n>=0?'+':'−')+fmt(Math.abs(n),d);
const dir=n=>n==null?'flat':n>0.005?'up':n<-0.005?'down':'flat';
const pct=n=>`<span class="num" style="color:var(--${dir(n)})">${sgn(n)}%</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>n==null?'—':Math.abs(n)>=1e12?'Rs '+fmt(n/1e12,2)+'tn':Math.abs(n)>=1e9?'Rs '+fmt(n/1e9,2)+'bn':'Rs '+fmt(n/1e6,1)+'mn';
const nice=s=>String(s||'').replace(/\s*&\s*/g,' & ').replace(/\s+/g,' ').trim();
const stockUrl=f=>'#/stock/'+encodeURIComponent(f);
const sectorUrl=c=>'#/sector/'+encodeURIComponent(c);
const disclaimer=`<footer>Data: Colombo Stock Exchange (cse.lk), collected after each trading day and may be delayed or incomplete. BullEng is an independent information site. Nothing here is investment advice or a recommendation to buy or sell any security.</footer>`;
let D=null, N=[], SM={}, FLK=null, period='pct_1d', query='';
const word={pos:'Likely positive',neg:'Likely negative',mixed:'Mixed impact'};
function when(iso){const d=new Date(iso);return d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Colombo'});}
function newsCards(list,empty){
  if(!list.length) return `<p class="msg">${empty}</p>`;
  const secName=Object.fromEntries(D.sectors.map(s=>[s.code,nice(s.name)]));
  return `<div class="news">${list.map(n=>`<article class="item ${n.impact==='mixed'?'neutral':n.impact}">
    <div class="meta">${esc(n.source)} · ${esc(when(n.published))} · ${word[n.impact]||''}</div>
    <h3><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></h3>
    ${n.why?`<p>${esc(n.why)}</p>`:''}
    <div class="tags">${(n.sectors||[]).map(s=>`<a class="tag ${s.dir}" href="${sectorUrl(s.code)}">${s.dir==='pos'?'▲':'▼'} ${esc(secName[s.code]||s.code)}</a>`).join('')}
      ${(n.stocks||[]).map(s=>`<a class="tag ${s.dir}" href="${stockUrl(s.sym)}">${esc(s.sym.split('.')[0])}</a>`).join('')}</div>
  </article>`).join('')}</div>`;
}
const aiNote=`<p class="note" style="margin-top:10px">Summaries and sector tags are written automatically by AI from the headline and may be wrong. Tap a headline to read the original article.</p>`;

function lineChart(v){
  const W=600,H=200,pl=4,pr=64,pt=12,pb=12, mn=Math.min(...v), mx=Math.max(...v), r=mx-mn||1;
  const x=i=>pl+i*(W-pl-pr)/(v.length-1), y=n=>pt+(H-pt-pb)*(1-(n-mn)/r);
  const c=v[v.length-1]>=v[0]?'var(--up)':'var(--down)';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="ASPI chart">
    <line x1="${pl}" x2="${W-pr}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${pl}" x2="${W-pr}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${W-pr+6}" y="${y(mx)+4}" font-size="12" fill="var(--ink3)">${fmt(mx)}</text>
    <text x="${W-pr+6}" y="${y(mn)+4}" font-size="12" fill="var(--ink3)">${fmt(mn)}</text>
    <polyline points="${v.map((n,i)=>x(i).toFixed(1)+','+y(n).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="4" fill="${c}"/></svg>`;
}
function tileColor(p){
  if(p==null||Math.abs(p)<=0.005) return 'var(--flat)';
  const t=Math.min(1,Math.abs(p)/(period==='pct_1d'?2:6));
  return `color-mix(in srgb, var(--${p>0?'up':'down'}) ${45+t*55}%, #2d3a3f)`;
}
function stockRows(list){
  return `<tr><th>Stock</th><th class="r">Price</th><th class="r">Change</th></tr>`+list.map(s=>`<tr>
    <td><a class="tlink" href="${stockUrl(s.full)}"><b>${esc(s.full)}</b></a><span class="co">${esc(nice(s.name))}</span></td>
    <td class="r num">${fmt(s.price,2)}</td><td class="r"><span class="pill num ${dir(s.pct)}">${sgn(s.pct)}%</span></td></tr>`).join('');
}

// ─── Home ───
function heat(){
  const rows=[...D.sectors].sort((a,b)=>(b.turnover||0)-(a.turnover||0));
  const noData=rows.every(s=>s[period]==null);
  return (noData?`<p class="note" style="margin-bottom:8px">The ${period==='pct_1w'?'1-week view needs 5':'1-month view needs 21'} trading days of history. BullEng started collecting on 24 September 2026, so this fills in automatically.</p>`:'')+
  `<div class="heat">${rows.map((s,i)=>`<a class="tile ${i===0?'w2 h2':i<3?'w2':''}" href="${sectorUrl(s.code)}" style="background:${tileColor(s[period])};text-decoration:none">
    <div class="tn">${esc(nice(s.name))}</div>
    <div><div class="tp num">${s[period]==null?'—':sgn(s[period])+'%'}</div>${i<6?`<div class="tv num">${rs(s.turnover)} traded</div>`:''}</div></a>`).join('')}</div>`;
}
function allStocks(){
  const q=query.trim().toLowerCase();
  let list=D.stocks.filter(s=>s.cls==='N'||s.cls==='X');
  if(q) list=list.filter(s=>s.full.toLowerCase().includes(q)||String(s.name).toLowerCase().includes(q));
  list=list.sort((a,b)=>(b.turnover||0)-(a.turnover||0)).slice(0,q?100:25);
  return list.length?`<table>${stockRows(list)}</table>`:`<p class="msg">No stock matches "${esc(query)}".</p>`;
}

function stockPage(full){

  if(!s) return `${back}<p class="msg">No data for ${esc(full)} today.</p>${disclaimer}`;
  document.title=`BullEng · ${s.full} ${nice(s.name)}`;
  const lo=s.low, hi=s.high, pos=(hi>lo&&s.price!=null)?Math.min(100,Math.max(0,(s.price-lo)/(hi-lo)*100)):50;
  const cls={N:'Voting shares',X:'Non-voting shares',U:'Fund units'}[s.cls]||'';
  const sec=D.sectors.find(x=>x.code===SM[s.sym]);
  return `${back}
  <div class="dhead">
    <div><p class="dkind">Stock · ${sec?`<a href="${sectorUrl(sec.code)}">${esc(nice(sec.name))}</a> · `:''}${esc(cls)}</p><h1 class="dname">${esc(nice(s.name))}</h1><p class="note">CSE: ${esc(s.full)}</p></div>
    <div class="dprice"><b class="num">Rs ${fmt(s.price,2)}</b>${pct(s.pct)} <span class="note num">(${sgn(s.change)})</span>${s.cls==='N'?`<div id="ivSum">${ivSum('lk',s,f0)}</div>`:''}<br>${starBtn('lk:'+s.full)}</div>
  </div>
  <section class="cols">
    <div><div class="shead"><h2>Today's range</h2></div>
      <div class="panel">${hi&&lo?`<div class="range"><i style="left:${pos}%"></i></div><div class="rlab"><span>Low ${fmt(lo,2)}</span><span>High ${fmt(hi,2)}</span></div>`:'<p class="note">No trades today.</p>'}
        <div class="kv" style="margin-top:18px">
          <div><span>Previous close</span><b class="num">${fmt(s.prev,2)}</b></div>
          <div><span>Turnover</span><b class="num">${rs(s.turnover)}</b></div>
          <div><span>Shares traded</span><b class="num">${fmt(s.volume)}</b></div>
          <div><span>Trades</span><b class="num">${fmt(s.trades)}</b></div>

      <div class="panel"><div class="kv">

        <div><span>Share of CSE value</span><b class="num">${s.mcap&&D.market.market_cap?fmt(s.mcap/D.market.market_cap*100,2)+'%':'—'}</b></div>
      </div>
      </div></div>
  </section>
  ${s.cls==='N'?(f0?ivSection('lk',s,f0):`<section><div class="shead"><h2>Intrinsic value estimate</h2></div><p class="msg">This company's financial statements have not been read yet, or failed BullEng's checks. Coverage grows every day.</p></section>`):''}
  ${divSection(s.sym)}

    ${newsCards(N.filter(n=>(n.stocks||[]).some(x=>x.sym===s.full)),'No recent tagged news for this stock.')}</section>
  ${disclaimer}`;
}

// ─── Sector page ───
function sectorPage(code){
  const s=D.sectors.find(x=>x.code===code);
  const back=`<a class="back" href="#/">← Back to Colombo summary</a>`;
  if(!s) return `${back}<p class="msg">No data for this sector today.</p>${disclaimer}`;
  document.title=`BullEng · ${nice(s.name)} sector`;
  const share=D.sectors.reduce((t,x)=>t+(x.turnover||0),0);
  return `${back}
  <div class="dhead">
    <div><p class="dkind">CSE sector index</p><h1 class="dname">${esc(nice(s.name))}</h1><p class="note">Index ${fmt(s.value,2)}</p></div>
    <div class="dprice"><b>${pct(s.pct_1d)}</b><span class="note">today</span></div>
  </div>
  <section><div class="panel"><div class="kv">
    <div><span>1 day</span><b>${pct(s.pct_1d)}</b></div>
    <div><span>1 week</span><b>${s.pct_1w==null?'<span class="note">building</span>':pct(s.pct_1w)}</b></div>
    <div><span>1 month</span><b>${s.pct_1m==null?'<span class="note">building</span>':pct(s.pct_1m)}</b></div>
    <div><span>Turnover today</span><b class="num">${rs(s.turnover)}</b></div>
    <div><span>Share of sector turnover</span><b class="num">${share?fmt(s.turnover/share*100,1)+'%':'—'}</b></div>
  </div>
  </div></section>
  <section><div class="shead"><div><h2>Companies in ${esc(nice(s.name))}</h2><p class="note">Largest first. Sector assignments are automatic and may occasionally differ from the CSE's official list.</p></div></div>
    ${(()=>{const m=D.stocks.filter(x=>x.cls==='N'&&SM[x.sym]===s.code).sort((a,b)=>(b.mcap||0)-(a.mcap||0));
      return m.length?`<div class="panel"><table>${stockRows(m)}</table></div>`:'<p class="msg">Company list for this sector is being prepared.</p>';})()}</section>
  <section><div class="shead"><h2>News that may affect ${esc(nice(s.name))}</h2></div>
    ${newsCards(N.filter(n=>(n.sectors||[]).some(x=>x.code===s.code)),'No recent tagged news for this sector.')}</section>
  ${disclaimer}`;
}

function dcfCalc(fcf,req,g5,gT){
  gT=Math.min(gT,req-0.01); let cf=fcf,pv=0;
  for(let y=1;y<=10;y++){const g=y<=5?g5:g5+(gT-g5)*(y-5)/5; cf*=1+g; pv+=cf/Math.pow(1+req,y);}
  const pvTV=cf*(1+gT)/(req-gT)/Math.pow(1+req,10);
  return {value:pv+pvTV,pv,pvTV,gT};
}
function ivCalc(f,req,g5,gT=0.025){
  const gD=Math.max(0,Math.min(g5,req-0.03));
  const D=f.fcfps>0?dcfCalc(f.fcfps,req,g5,gT):null;
  const meth=[
    {n:'Graham number',v:f.eps>0&&f.bvps>0?Math.sqrt(22.5*f.eps*f.bvps):null,how:'√(22.5 × EPS × book value per share). Benjamin Graham\'s ceiling price for a defensive investor. Ignores growth.'},
    {n:'Dividend discount',v:f.dps>0?f.dps*(1+gD)/(req-gD):null,how:'Next year\'s dividend ÷ (required return − growth). Suits steady dividend payers.'},
    {n:'Earnings power',v:f.eps>0?f.eps/req:null,how:'EPS ÷ required return. What today\'s profit is worth if it never grows, a cautious floor.'},
    {n:'Discounted cash flow (DCF)',v:D?D.value:null,how:f.bank?'Not used for banks, insurers and investment companies, where free cash flow does not measure the business well.':`Free cash flow grown for 5 years, fading to ${fmt(gT*100,1)}% by year 10, plus a terminal value, all discounted at the required return.`},
  ];
  const ok=meth.map(x=>x.v).filter(v=>v&&isFinite(v)&&v>0).sort((a,b)=>a-b), k=ok.length;
  return {meth,D,est:!k?null:k%2?ok[(k-1)/2]:(ok[k/2-1]+ok[k/2])/2,lo:ok[0],hi:ok[k-1]};
}
function ivSum(m,s,f){
  if(!f) return '';
  const M=IVX[m], v=ivCalc(f,ivReq[m],ivG[s.sym]??f.growth??0.04,M.gT);
  if(!v.est) return `<div class="iv">Intrinsic value: not available</div>`;
  const gap=(v.est/s.price-1)*100, cls=gap>10?'under':gap<-10?'over':'fair';
  const txt=gap>10?`Price ${fmt(gap)}% below estimate`:gap<-10?`Price ${fmt(-gap)}% above estimate`:'Price close to estimate';
  return `<div class="iv">Estimated intrinsic value <b class="num">${M.px(v.est)}</b><br><span class="gap ${cls}">${txt}</span>${v.D?`<br><span class="note">DCF alone: ${M.px(v.D.value)}</span>`:''}</div>`;
}
function ivPanel(m,s,f){
  const M=IVX[m], g5=ivG[s.sym]??f.growth??0.04, v=ivCalc(f,ivReq[m],g5,M.gT);
  let bar='';
  if(v.est){const lo=Math.min(v.lo,s.price)*0.9,hi=Math.max(v.hi,s.price)*1.1,pos=x=>((x-lo)/(hi-lo)*100).toFixed(1);
    bar=`<div class="ivbar" aria-hidden="true"><div class="rng" style="left:${pos(v.lo)}%;width:${(pos(v.hi)-pos(v.lo)).toFixed(1)}%"></div>
      <div class="mk px" style="left:${pos(s.price)}%"><span>Price ${M.px(s.price)}</span></div><div class="mk ev" style="left:${pos(v.est)}%"><span>Estimate ${M.px(v.est)}</span></div></div>
      <p class="note">Shaded band shows the range across the methods. The estimate is the middle value.</p>`;}
  return `${bar}
  <table style="margin-top:14px"><tr><th>Method</th><th class="r">Value per share</th></tr>${v.meth.map(x=>`<tr><td><b>${x.n}</b><span class="co">${x.how}</span></td><td class="r num">${x.v&&isFinite(x.v)&&x.v>0?M.px(x.v):'n/a'}</td></tr>`).join('')}</table>
  <div class="kv" style="margin-top:16px">
    <div><span>${m==='lk'?'EPS (underlying)':m==='uk'?'EPS (diluted, pence)':'EPS (diluted)'}</span><b class="num">${M.px(f.eps)}</b></div>

    <div><span>Dividend / share</span><b class="num">${M.px(f.dps||0)}</b></div>
    <div><span>Free cash flow / share</span><b class="num">${f.fcfps==null?'—':M.px(f.fcfps)}</b></div>
    <div><span>${m==='lk'?'Revenue growth (vs last year)':'Revenue growth (up to 5 yrs)'}</span><b class="num">${f.rev_cagr==null?'—':fmt(f.rev_cagr*100,1)+'%'+(m==='lk'?'':' a year')}</b></div>
  </div>
  ${v.D?`<h3 style="font-size:15px;margin:18px 0 8px">DCF breakdown</h3><div class="kv">
    <div><span>Value of next 10 years</span><b class="num">${M.px(v.D.pv)}</b></div>
    <div><span>Value after year 10</span><b class="num">${M.px(v.D.pvTV)}</b></div>
    <div><span>Share from after year 10</span><b class="num">${fmt(v.D.pvTV/(v.D.pv+v.D.pvTV)*100)}%</b></div></div>`:''}`;
}
function ivSection(m,s,f){
  if(!f) return `<section><div class="shead"><h2>Intrinsic value estimate</h2></div><p class="msg">Financial figures for this company are not available yet.</p></section>`;
  const g5=ivG[s.sym]??f.growth??0.04;
  return `<section><div class="shead"><div><h2>Intrinsic value estimate</h2><p class="note">${IVX[m].src(f)}</p></div></div>
    <div class="panel">
      <div class="ctrl"><label for="req">Required return</label><input type="range" id="req" min="5" max="${IVX[m].reqMax}" step="0.5" value="${ivReq[m]*100}"><b class="num" id="reqVal">${fmt(ivReq[m]*100,1)}%</b></div>
      <div class="ctrl"><label for="g5">Growth, next 5 years</label><input type="range" id="g5" min="0" max="30" step="0.5" value="${g5*100}"><b class="num" id="g5Val">${fmt(g5*100,1)}%</b></div>
      <div id="ivPanel">${ivPanel(m,s,f)}</div>
      <details><summary>How to read this</summary>
        <p>Required return is the yearly return you would want for owning ${IVX[m].who}, usually the government bond yield plus a few percent. Raise it and the estimates fall.</p>
        <p>Growth starts from the company's own revenue growth${m==='lk'?' over the last year':' over up to five years'}, capped at 15%, and is used by the DCF and dividend methods. Small changes move the DCF a lot, so treat it as a what-if tool.</p>
        <p>The Graham number and earnings power ignore growth, so fast-growing companies often look expensive on them, while the DCF rewards growth. That is why the methods disagree and the estimate is the middle value.</p>
        <p>This is a rough, automatic estimate from published figures. It is not a price target or advice to buy or sell.</p>
      </details>
    </div></section>`;
}

function belowEstimate(m,F){
  const M=IVX[m], list=m==='lk'?(D?D.stocks.filter(x=>x.cls==='N'):[]):MD[m].stocks;
  if(!F||!F.stocks||!Object.keys(F.stocks).length) return belowEstimatePending(m==='lk'?'CSE':MK[m].name);
  const rows=[];
  for(const s of list){const f=F.stocks[s.sym]; if(!f||!s.price) continue;
    const v=ivCalc(f,ivReq[m],f.growth??0.04,M.gT); if(v.est&&v.est>s.price) rows.push({s,est:v.est,gap:(v.est/s.price-1)*100});}
  rows.sort((a,b)=>b.gap-a.gap);
  const top=rows.slice(0,5);
  return `<section><div class="shead"><div><h2>Top 5 priced below BullEng's estimate</h2><p class="note">Largest gaps between share price and the automatic intrinsic value estimate, using default assumptions</p></div></div>
    ${top.length?`<div class="panel"><table><tr><th>Stock</th><th class="r">Price</th><th class="r">Estimate</th><th class="r">Gap</th></tr>${top.map(r=>`<tr>
      <td><a class="tlink" href="${M.href(r.s)}"><b>${esc(M.sym(r.s))}</b></a><span class="co">${esc(M.name(r.s))}</span></td>
      <td class="r num">${M.px(r.s.price)}</td><td class="r num">${M.px(r.est)}</td><td class="r"><span class="pill num up">+${fmt(r.gap)}%</span></td></tr>`).join('')}</table>
      <p class="note" style="margin-top:12px">A price below an automatic estimate is not a reason to buy. The estimates are rough, use the latest published figures${m==='lk'?' read automatically from company filings':''}, and can be far off, especially for banks, cyclical and fast-changing companies. Not investment advice.</p></div>`
      :'<p class="msg">No tracked stock is currently priced below its estimate.</p>'}</section>`;
}

// ─── Data freshness ───
function freshInfo(iso,market){
  if(!iso) return {late:false,txt:''};
  const t=new Date(iso), now=new Date(), hrs=(now-t)/36e5;
  let allow=market==='crypto'?15:30;
  if(market!=='crypto'){ const d=now.getUTCDay(); allow+= d===6?24:d===0?48:d===1?72:0; }
  const same=t.toDateString()===now.toDateString();
  const when=t.toLocaleString('en-GB',same?{hour:'numeric',minute:'2-digit',timeZone:'Europe/London'}:{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:'Europe/London'});
  return {late:hrs>allow, txt:`Updated ${when}${same?' today':''} UK time`};
}
function freshBadge(iso,market){
  const f=freshInfo(iso,market); if(!f.txt) return '';
  return `<span class="fresh${f.late?' late':''}">${f.late?'Delayed · ':''}${esc(f.txt)}</span>`;
}
function delayBanner(iso,market){
  const f=freshInfo(iso,market);
  return f.late?`<div class="delay">⚠ This data may be out of date. The last successful update was ${esc(f.txt.replace('Updated ',''))}. BullEng updates automatically, so it should catch up soon.</div>`:'';
}

  const past=(E.earnings||[]).filter(e=>e.last&&e.last.date>=since).sort((a,b)=>b.last.date.localeCompare(a.last.date)).slice(0,10);
  const upT=up.length?`<h3 style="font-size:15px;margin:4px 0 8px">Reporting in the next three weeks</h3><table><tr><th>Stock</th><th class="r">Date</th></tr>${up.map(e=>`<tr><td><a class="tlink" href="${gStock(m,e.sym)}"><b>${esc(e.sym)}</b></a><span class="co">${esc(e.name)}</span></td><td class="r num">${dfmt(e.next)}</td></tr>`).join('')}</table>`:'';
  const pastT=past.length?`<h3 style="font-size:15px;margin:${up.length?18:4}px 0 8px">Recently reported</h3><table><tr><th>Stock</th><th class="r">EPS vs estimate</th><th class="r">Surprise</th></tr>${past.map(e=>`<tr><td><a class="tlink" href="${gStock(m,e.sym)}"><b>${esc(e.sym)}</b></a><span class="co">${esc(e.name)} · ${dfmt(e.last.date)}</span></td>
    <td class="r num">${e.last.eps??'—'} vs ${e.last.estimate??'—'}</td><td class="r">${e.last.surprise==null?'—':`<span class="pill num ${dir(e.last.surprise)}">${sgn(e.last.surprise,1)}%</span>`}</td></tr>`).join('')}</table>`:'';
  const body=(upT||pastT)?`<div class="panel">${upT}${pastT}<p class="note" style="margin-top:10px">Earnings per share in the company's reporting currency. Estimates are analysts' consensus forecasts via Yahoo Finance. Dates can change.</p></div>`
    :'<p class="msg">No tracked companies reported in the last three weeks or are due in the next three.</p>';
  return `<section><div class="shead"><div><h2>Earnings season</h2><p class="note">Recent and upcoming results for tracked ${MK[m].name} companies</p></div></div>${body}</section>`;
}
function gEventsKV(m,sym){
  const E=GEV[m]||{}, M=MK[m], d=(E.dividends||[]).find(x=>x.sym===sym), e=(E.earnings||[]).find(x=>x.sym===sym);
  if(!d&&!e) return '';
  return `<section><div class="shead"><h2>Dividends and earnings</h2></div><div class="panel"><div class="kv">
    ${d?`<div><span>Next ex-dividend</span><b class="num">${d.ex_date?dfmt(d.ex_date):'—'}</b></div>
    <div><span>Last dividend</span><b class="num">${d.last_amount?M.px(d.last_amount):'—'}</b></div>
    <div><span>Dividends, last 12 months</span><b class="num">${d.ttm?M.px(d.ttm):'—'}</b></div>
    <div><span>Dividend yield</span><b class="num">${d.yield?(d.yield<0.1?'under 0.1%':fmt(d.yield,1)+'%'):'—'}</b></div>`:''}
    ${e?`<div><span>Next results</span><b class="num">${e.next?dfmt(e.next):'—'}</b></div>
    ${e.last?`<div><span>Last results (${dfmt(e.last.date)})</span><b class="num">EPS ${e.last.eps??'—'}${e.last.surprise!=null?` · ${sgn(e.last.surprise,1)}% vs estimate`:''}</b></div>`:''}`:''}
  </div></div></section>`;
}
// ─── Methodology ───
function methodPage(){
  document.title='BullEng · How BullEng works';
  return `<article class="prose">
  <h1>How BullEng works</h1>
  <p>This page explains, in plain language, how every number on BullEng is produced.</p>
  <h2>Daily market data</h2>
  <p>Colombo data is collected from the CSE after each close, around 3:30pm Sri Lanka time. US and UK data is collected after both markets close, around 11:30pm UK time. Crypto is updated twice a day. Each page shows when it was last updated, and warns you if an update is late.</p>
  <h2>Top gainers and losers</h2>
  <p>On the CSE, only shares with at least Rs 1 million traded that day are included, so a single tiny trade cannot top the list. Crypto movers need at least $5 million traded. US and UK lists cover the companies BullEng tracks.</p>
  <h2>Market breadth</h2>
  <p>The number of shares that rose, fell or stayed flat. A market can rise on a few big stocks while most shares fall; breadth shows that.</p>
  <h2>Fear &amp; Greed indices</h2>
  <p>A 0 to 100 mood score. For the US and UK it averages five signals, each ranked against its own past year: momentum (the index versus its 50-day average), strength (where the index sits between its 52-week low and high), breadth (share of tracked stocks above their 50-day average), volatility (VIX in the US, price swings in the UK) and safe-haven demand (shares versus government bonds over 20 days). The CSE version uses breadth, foreign investor flows and news sentiment, plus momentum and volatility once 20 sessions are recorded, each on fixed ranges. The crypto index comes from alternative.me. None of these say whether anything is cheap or expensive.</p>
  <h2>Intrinsic value estimates</h2>
  <p>Four standard methods, applied automatically to the latest published figures:</p>
  <ul>
    <li><b>Graham number:</b> the square root of 22.5 × earnings per share × book value per share. A conservative ceiling price that ignores growth.</li>
    <li><b>Dividend discount:</b> next year's dividend divided by (required return minus growth). Best for steady dividend payers.</li>
    <li><b>Earnings power:</b> earnings per share divided by the required return. What today's profit is worth if it never grows.</li>
    <li><b>Discounted cash flow (DCF):</b> free cash flow per share grown for five years, fading to a long-run rate by year ten, plus a value for everything after, all discounted at the required return. Not used for banks, insurers or investment companies.</li>
  </ul>
  <p>The headline estimate is the middle of the available methods, so one extreme result cannot dominate. Default required returns are 14% for the CSE, 9% for the UK and 8.5% for the US, reflecting interest rates and risk; you can change them with the sliders. Default growth comes from each company's own revenue growth, capped at 15%.</p>
  <h2>CSE company figures</h2>
  <p>BullEng reads each company's latest financial statements from the CSE with AI, and, where needed, its last full-year statements, to build trailing 12-month figures. One-off gains and losses, such as disposal gains or bargain purchase gains, are removed so estimates use underlying profit. Every result must pass checks (earnings per share × shares must match profit, the share count must match market value, and the price-to-earnings ratio must be plausible) or it is left out.</p>
  <h2>News tagging</h2>
  <p>Headlines are collected several times a day. AI decides whether each is relevant, writes one sentence on why it matters, and tags the sectors and stocks it may help or hurt, using only BullEng's real sector and stock lists. The AI sees only the headline, so tags can be wrong; always read the original article.</p>
  <h2>Sectors</h2>
  <p>CSE companies use the sector from their official CSE profile where available, otherwise an AI assignment to one of the 20 CSE sectors. US sectors use the 11 SPDR sector funds; UK sector moves average the tracked FTSE companies in each sector.</p>
  <h2>Dividends and earnings</h2>
  <p>Colombo dividend announcements and financial report filings come from the CSE's announcement feeds and are archived daily from 25 September 2026. For US and UK stocks, ex-dividend dates, payment dates, dividend history, earnings dates and analysts' earnings estimates come from Yahoo Finance and are refreshed every weekday. Yield is the last 12 months of dividends divided by today's price. Always confirm dates and amounts in the official announcement.</p>
  <p class="note">Questions or corrections: <a href="mailto:${CONTACT}">${CONTACT}</a></p>
  </article>`;
}

async function render(){
  const app=document.getElementById('app'), h=location.hash;
  const cm=h.match(/^#\/crypto(?:\/coin\/(.+))?$/);
  if(cm){
    document.querySelectorAll('nav a[data-m]').forEach(a=>a.classList.toggle('on',a.dataset.m==='crypto'));
    if(!CD){ app.innerHTML='<p class="msg">Loading crypto data…</p>';
      try{ CD=await fetch('data/crypto/site.json',{cache:'no-cache'}).then(r=>{if(!r.ok) throw 0;return r.json();}); }
      catch(e){ app.innerHTML='<p class="msg">Crypto data could not be loaded. Please refresh in a minute.</p>'; return; } }
    if(!CN) CN=await fetch('data/news/crypto/tagged.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{items:[]}).then(j=>j.items||[]).catch(()=>[]);
    app.innerHTML=cm[1]?cCoin(decodeURIComponent(cm[1])):cHome();
    window.scrollTo(0,0);
    const q=document.getElementById('cq'); if(q) q.oninput=()=>{cq=q.value;document.getElementById('clist').innerHTML=cAll();};
    return;
  }
  if(h==='#/about'||h==='#/privacy'||h==='#/methodology'){
    document.querySelectorAll('nav a[data-m]').forEach(a=>a.classList.remove('on'));
    app.innerHTML=h==='#/about'?aboutPage():h==='#/privacy'?privacyPage():methodPage(); window.scrollTo(0,0); return;
  }
  if(h==='#/search'){document.querySelectorAll('nav a[data-m]').forEach(a=>a.classList.remove('on'));await searchPage(app);window.scrollTo(0,0);return;}
  const g=h.match(/^#\/(us|uk)(?:\/(stock|sector)\/(.+))?$/);
  const mkt=g?g[1]:'lk';
  document.querySelectorAll('nav a[data-m]').forEach(a=>a.classList.toggle('on',a.dataset.m===mkt));
  if(g){
    const m=g[1];
    if(!(MD[m] && MD[m].stocks)){
      app.innerHTML=`<p class="msg">Loading ${MK[m].name} market data…</p>`;
      try{ MD[m]=await loadMarket(m); }catch(e){ MD[m]=null; app.innerHTML=`<p class="msg">${MK[m].name} data could not be loaded. Please refresh in a minute.</p>`; return; }
    }
    const F=await loadFund(m);
    FGD=await loadFG();
    GNL[m]=await loadNews(m);
    await loadGEV(m);
    app.innerHTML=!g[2]?gHome(m,F):g[2]==='stock'?gStockPage(m,decodeURIComponent(g[3]),F):gSectorPage(m,decodeURIComponent(g[3]));
    if(g[2]==='stock'&&F&&F.stocks){const sym=decodeURIComponent(g[3]);const st=MD[m].stocks.find(x=>x.sym===sym);if(st) wireIV(m,st,F.stocks[sym]);}
    window.scrollTo(0,0);
    if(!g[2]){
      app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{period=b.dataset.p;
        app.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
        document.getElementById('heatWrap').innerHTML=gHeat(m);});
      const q=document.getElementById('q');
      q.oninput=()=>{mq[m]=q.value;document.getElementById('stockList').innerHTML=gAll(m);};
    }
    return;
  }
  if(!D){app.innerHTML='<p class="msg">Loading today\'s CSE data…</p>';return;}
  if(!FLK) FLK=await loadFund('lk');
  FGD=await loadFG();
  await loadEvents();
  const m=h.match(/^#\/(stock|sector)\/(.+)$/);
  app.innerHTML=!m?home():m[1]==='stock'?stockPage(decodeURIComponent(m[2])):sectorPage(decodeURIComponent(m[2]));
  if(m) window.scrollTo(0,0);
  if(m&&m[1]==='stock'){const st=D.stocks.find(x=>x.full===decodeURIComponent(m[2]));if(st&&FLK&&FLK.stocks[st.sym]) wireIV('lk',st,FLK.stocks[st.sym]);}
  if(!m){
    app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{period=b.dataset.p;
      app.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      document.getElementById('heatWrap').innerHTML=heat();});
    const q=document.getElementById('q');
    q.oninput=()=>{query=q.value;document.getElementById('stockList').innerHTML=allStocks();};
  }
}

// Theme toggle
(function(){
  const btn=document.getElementById('themeBtn'), root=document.documentElement;
  const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const label=()=>{btn.textContent=isDark()?'☀':'☾';btn.setAttribute('aria-label',isDark()?'Switch to light theme':'Switch to dark theme');};
  try{const s=localStorage.getItem('bulleng-theme'); if(s) root.dataset.theme=s;}catch(e){}
  label();
  btn.addEventListener('click',()=>{root.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('bulleng-theme',root.dataset.theme);}catch(e){}label();});
})();
